name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push to a branch cancels that branch's older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Otty is a macOS app, and the D-1 OCR helper will need swiftc.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # postinstall downloads the Electron binary; keep it between runs.
      - name: Cache Electron binary
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - run: npm ci
      # D-48: type-aware lint against a baseline that may only shrink.
      - run: npm run lint
      # D-48: no unused files, exports or dependencies.
      - run: npm run knip
      - run: npm run typecheck
      # Unit tests, held to coverage floors that only go up (D-48).
      - run: npm run coverage
      - run: npm run build
      # D-47: nothing of the smoke harness may reach the release build.
      - run: node tools/smoke/check-release.mjs

  screens:
    # D-48: every UI preview view and scene, light and dark, against the committed screenshots. Pinned, because the
    # baselines come from this Mac (tools/ui-preview/screens/from-ci.mjs): another macOS draws Chinese differently.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron binary
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run screens

      - name: Keep the diff images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screens-diff
          path: tools/ui-preview/screens/results/
          retention-days: 14

  smoke:
    # D-47: the real app, driven by Playwright against a fake world. Nothing leaves the runner. Only for PRs into main
    # and pushes to it, so a stack of PRs runs it once, when each one is retargeted to main.
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron binary
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - run: npm ci
      # Builds (the OCR helper, the app and the smoke entry), then runs. Playwright drives Electron itself, so no
      # browsers are downloaded.
      - run: npm run smoke

      - name: Keep the report, traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: |
            tools/smoke/report/
            tools/smoke/results/
          retention-days: 14
