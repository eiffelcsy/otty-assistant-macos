name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push to a branch cancels that branch's older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Otty is a macOS app, and the D-1 OCR helper will need swiftc.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # postinstall downloads the Electron binary; keep it between runs.
      - name: Cache Electron binary
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
